name: Build and release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish release / Опубликовать выпуск'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: developer/package-lock.json
      - name: Check source and commit privacy
        run: python3 scripts/verify_source.py
      - name: Check deterministic packaging
        run: python3 scripts/test_build.py
      - name: Install locked test dependencies
        working-directory: developer
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check logic and settings
        working-directory: developer
        run: npm test
      - name: Install Chromium for extension tests
        working-directory: developer
        run: npx playwright install --with-deps chromium
      - name: Check real MV3 and CSS regressions
        working-directory: developer
        env:
          TBK_TEST_OUTPUT: ${{ runner.temp }}/tbk-browser-checks
          TBK_BROWSER_NAME: chromium
        run: |
          npm run test:browser
          npm run test:v3
          npm run test:surfaces
          npm run test:chat
          npm run test:chat-header
          npm run test:chat-notices
          npm run test:sidebar-preview
      - name: Build installation archives
        run: python3 scripts/build_release.py
      - name: Verify installation of both archives
        run: |
          python3 - <<'PY'
          import hashlib, json, os, zipfile
          from pathlib import Path
          root = Path.cwd()
          out = Path(os.environ['RUNNER_TEMP']) / 'tbk-packages'
          version = json.loads((root / 'manifest.json').read_text(encoding='utf-8-sig'))['version']
          for browser in ('chrome', 'opera-gx'):
              archive = root / 'dist' / ('TBK-Twitch-Ambilight-v' + version + '-' + browser + '.zip')
              target = out / browser
              target.mkdir(parents=True, exist_ok=True)
              with zipfile.ZipFile(archive) as package:
                  package.extractall(target / 'install')
              report = {'version': version, 'browserTarget': browser, 'sha256': hashlib.sha256(archive.read_bytes()).hexdigest(), 'extracted': str(target / 'install/TBK-Twitch-Ambilight')}
              (target / 'package-report.json').write_text(json.dumps(report), encoding='utf8')
          PY
          cd developer
          TBK_PACKAGE_REPORT="$RUNNER_TEMP/tbk-packages/chrome/package-report.json" node package-smoke.cjs
          TBK_PACKAGE_REPORT="$RUNNER_TEMP/tbk-packages/opera-gx/package-report.json" node package-smoke.cjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installation-packages
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
  publish:
    needs: build
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: installation-packages
          path: dist
      - name: Publish checked ZIPs and checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/publish_release.py
