name: Publish source 3.0.5
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Publish verified source snapshot
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          REPO='TBK-10000/TBK-Twitch-Ambilight'
          BASE='https://api.github.com/repos/'+REPO
          TREE='1084d09e4c1257060a46c5489b929ce12cad48c8'
          PARENT='4e15ef928a613a63f636973b684ff8f609e7ed01'
          PREPARED='eba6ae213b98f9cc01f49b8200c0b07667f3f599'
          EMAIL='291647819+TBK-10000@users.noreply.github.com'
          def api(path,method='GET',data=None,missing=False):
              req=urllib.request.Request(BASE+path,data=json.dumps(data).encode() if data else None,method=method,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json','User-Agent':'TBK-Publication'})
              try:
                  with urllib.request.urlopen(req,timeout=40) as response: return json.load(response)
              except urllib.error.HTTPError as error:
                  if missing and error.code==404:return None
                  raise RuntimeError('GitHub publication failed: '+method+' '+str(error.code)) from None
          assert os.environ['GITHUB_REPOSITORY']==REPO and os.environ['GITHUB_ACTOR']=='TBK-10000'
          head=api('/git/ref/heads/main')['object']['sha']
          assert head==os.environ['GITHUB_SHA']
          assert api('/git/commits/'+head)['parents'][0]['sha']==PREPARED
          assert api('/git/commits/'+PREPARED)['parents'][0]['sha']==PARENT
          assert api('/git/ref/tags/v3.0.2')['object']['sha']==PARENT
          assert api('/git/ref/tags/v3.0.5',missing=True) is None
          files=[x for x in api('/git/trees/'+TREE+'?recursive=1')['tree'] if x['type']=='blob']
          assert len(files)==47 and not any(x['path'].startswith(('verification/','artifacts/')) or x['path'].endswith('TEST-REPORT.md') for x in files)
          created=api('/git/commits','POST',{'message':'Release 3.0.5','tree':TREE,'parents':[PARENT],'author':{'name':'TBK-10000','email':EMAIL},'committer':{'name':'TBK-10000','email':EMAIL}})
          assert created['author']['email']==EMAIL and created['committer']['email']==EMAIL
          assert api('/git/ref/heads/main')['object']['sha']==head
          api('/git/refs/heads/main','PATCH',{'sha':created['sha'],'force':True})
          api('/git/refs','POST',{'ref':'refs/tags/v3.0.5','sha':created['sha']})
          assert api('/git/ref/heads/main')['object']['sha']==created['sha']
          assert api('/git/ref/tags/v3.0.2')['object']['sha']==PARENT
          print(json.dumps({'sourceCommit':created['sha'],'tag':'v3.0.5','files':47,'author':'GitHub noreply'}))
          PY
